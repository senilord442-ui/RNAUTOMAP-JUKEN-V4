name: Build RNAUTOMAP V10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cari ZIP V10
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*RNAUTOMAP-V10*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP RNAUTOMAP V10 tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project V10
        run: |
          mkdir -p v10_project
          unzip -o "$ZIP_PATH" -d v10_project

          echo "Struktur project:"
          find v10_project -maxdepth 3 -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK V10
        working-directory: v10_project/RNAUTOMAP-V10
        run: |
          gradle assembleDebug --stacktrace

      - name: Cari APK
        run: |
          APK=$(find v10_project/RNAUTOMAP-V10 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            exit 1
          fi

          echo "APK ditemukan: $APK"
          cp "$APK" RNAUTOMAP-V10-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-V10-debug-APK
          path: RNAUTOMAP-V10-debug.apk
