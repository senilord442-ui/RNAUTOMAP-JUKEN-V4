name: Build RNAUTOMAP APK v4

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=== FILE DI REPOSITORY ==="
          find . -maxdepth 2 -type f -print

          ZIP=$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP TIDAK DITEMUKAN"
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -type f -name 'settings.gradle' -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERROR: PROJECT TIDAK DITEMUKAN"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT: $PROJECT_DIR"

          test -f "$PROJECT_DIR/app/build.gradle"

          echo "=== MULAI BUILD APK ==="
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-debug-APK-v4
          path: 'extracted/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
