name: Buat RNAUTOMAP APK V9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instal Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instal Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak dan buat APK V9
        shell: bash
        run: |
          set -e

          ZIP="RNAUTOMAP-JUKEN-V9.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP tidak ditemukan"
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          SETTINGS=$(find extracted -maxdepth 5 -type f -name 'settings.gradle' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Unggah APK V9
        uses: actions/upload-artifact@v4
        with:
          name: RNAUTOMAP-debug-APK-v9
          path: 'extracted/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
